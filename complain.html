<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIISER Feedback Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #1a1a1a;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(33, 150, 242, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(33, 150, 242, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(33, 150, 242, 0.05) 0%, transparent 50%);
            z-index: -1;
            animation: backgroundShift 20s ease-in-out infinite;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-10px) translateY(-10px); }
        }

        .container {
            max-width: 900px;
            padding: 3rem 2rem 5rem;
            width: 100%;
            margin: auto;
            position: relative;
            z-index: 2;
        }

        .container h1 {
            margin-bottom: 1rem;
            color: #2196f2;
            text-align: center;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2196f2, #1976d2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s ease-in-out infinite alternate;
            text-shadow: 0 0 30px rgba(33, 150, 242, 0.3);
        }

        @keyframes titleGlow {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.1); }
        }

        .container p {
            margin-bottom: 2.5rem;
            color: #64748b;
            text-align: center;
            font-size: 1.1rem;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .complain-feedback {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            animation: formSlideIn 1s ease-out 0.4s both;
            border: 1px solid rgba(33, 150, 242, 0.1);
        }

        @keyframes formSlideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
            animation: fieldFadeIn 0.6s ease-out both;
            animation-delay: calc(var(--animation-order) * 0.1s);
        }

        @keyframes fieldFadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .heading {
            margin-bottom: 0.6rem;
            color: #334155;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .complain-input, .complain-textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            position: relative;
        }

        .complain-input:focus, .complain-textarea:focus {
            outline: none;
            border-color: #2196f2;
            background: rgba(255, 255, 255, 1);
            box-shadow: 
                0 0 0 3px rgba(33, 150, 242, 0.1),
                0 4px 12px rgba(33, 150, 242, 0.15);
            transform: translateY(-2px);
        }

        .complain-input:hover, .complain-textarea:hover {
            border-color: #94a3b8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .complain-textarea {
            resize: vertical;
            min-height: 100px;
        }
        .hostel-select{
            width: 100%;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            font-size: 0.95rem;

        }
        .file-drop-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #cbd5e1;
            cursor: pointer;
            text-align: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            height: 150px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .file-drop-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(33, 150, 242, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .file-drop-box:hover {
            background: linear-gradient(135deg, #e8f0ff, #dbeafe);
            border-color: #2196f3;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(33, 150, 242, 0.15);
        }

        .file-drop-box:hover::before {
            left: 100%;
        }

        .file-drop-box.dragover {
            border-color: #2196f3;
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            transform: scale(1.02);
        }

        .file-drop-box input[type="file"] {
            display: none;
        }

        .upload-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 0.5rem;
            transition: transform 0.3s ease;
            filter: opacity(0.7);
        }

        .file-drop-box:hover .upload-icon {
            transform: translateY(-5px) scale(1.1);
        }

        .upload-text {
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .file-name {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #2196f3;
            font-weight: 600;
        }

        .complain-submit-button {
            padding: 0.75rem 2rem;
            border-radius: 50px;
            background: linear-gradient(135deg, #2196f3, #1976d2);
            font-size: 1rem;
            color: white;
            border: none;
            cursor: pointer;
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 2rem auto 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(33, 150, 242, 0.3);
        }

        .complain-submit-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .complain-submit-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(33, 150, 242, 0.4);
            background: linear-gradient(135deg, #1976d2, #1565c0);
        }

        .complain-submit-button:hover::before {
            left: 100%;
        }

        .complain-submit-button:active {
            transform: translateY(-1px);
        }

        .complain-submit-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Progress bar for form completion */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #2196f3, #1976d2);
            transition: width 0.3s ease;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(33, 150, 242, 0.5);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 2rem 1rem 3rem;
            }
            
            .container h1 {
                font-size: 2.5rem;
            }
            
            .complain-feedback {
                padding: 1.5rem;
                border-radius: 16px;
            }
            
            .file-drop-box {
                max-width: 100%;
                height: 120px;
            }
        }

        /* Success animation */
        @keyframes successPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .success-feedback {
            animation: successPulse 0.6s ease-in-out;
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>
    
    <div class="container">
        <h1>Complaints & Grievances</h1>
        <p>Register your complain with the Hostel Management Department</p>
        
        <form id="complains" class="complain-feedback">
            <div class="form-group" style="--animation-order: 1">
                <h4 class="heading">Enter your Name*</h4>
                <input type="text" name="name" placeholder="Your Full Name" class="complain-input" required>
            </div>

            <div class="form-group" style="--animation-order: 2">
                <h4 class="heading">Enter your Roll Number*</h4>
                <input type="text" name="roll" placeholder="Roll Number" class="complain-input" required>
            </div>

            <div class="form-group" style="--animation-order: 3">
                <h4 class="heading">Enter your E-mail ID*</h4>
                <input type="email" name="email" placeholder="Email Address" class="complain-input" required>
            </div>

            <div class="form-group" style="--animation-order: 4">
                <h4 class="heading">Enter your Mobile Number</h4>
                <input type="tel" name="mobile" placeholder="Mobile Number" class="complain-input">
            </div>

            <div class="form-group" style="--animation-order: 5">
                <h4 class="heading">Hostel</h4>
                <select class="hostel-select" id="hostelSelect">
                    <option value="">Select Hostel</option>
                    <option value="h1">Sister Nivediata Hostel</option>
                    <option value="h2">Kalpana Chawla Hostel</option>
                    <option value="h3">Virangana Lakshmibai Hostel, Block-1</option>
                    <option value="h4">Virangana Lakshmibai Hostel, Block-2</option>
                    <option value="h5">Type — II Hostel</option>
                    <option value="h6">Aryabhatt Hostel</option>
                    <option value="h7">Bhaskaracharya Hostel</option>
                    <option value="h8">Sir C. V. Raman Hostel</option>
                    <option value="h9">Sir J.C. Bose Hostel</option>
                    <option value="h10">Varahmihir Hostel</option>
                    <option value="h11">Sir Vishveshwarya Hostel</option>
                    <option value="h12">Homi Jehangir Bhabha Hostel</option>
                    <option value="h13">Ramanujan Hostel</option>
                    <option value="h14">Dr. APJ Abdul Kalam Hostel</option>
                    
                </select>
            </div>

            <div class="form-group" style="--animation-order: 6">
                <h4 class="heading">Room Number</h4>
                <input type="text" name="room" placeholder="Room Number" class="complain-input">
            </div>

            <div class="form-group" style="--animation-order: 7">
                <h4 class="heading">Subject*</h4>
                <textarea name="Subject" placeholder="Mention the subject of your complain" class="complain-textarea" rows="4" required></textarea>
            </div>
            <div class="form-group" style="--animation-order: 8">
                <h4 class="heading">Register Your Compalain*</h4>
                <textarea name="description" placeholder="Describe your problem in detail..." class="complain-textarea" rows="4" required></textarea>
            </div>

            <div class="form-group" style="--animation-order: 9">
                <h4 class="heading">Upload image to support your review</h4>
                <label for="fileUpload" class="file-drop-box">
                    <img src="https://cdn-icons-png.flaticon.com/512/724/724933.png" alt="Upload Icon" class="upload-icon">
                    <div class="upload-text">Click to upload or drag and drop</div>
                    <div class="upload-text" style="font-size: 0.8rem; margin-top: 0.25rem;">PNG, JPG, GIF up to 10MB</div>
                    <input type="file" id="fileUpload" name="file" accept="image/*" class="complain-file-input">
                    <div class="file-name" id="fileName"></div>
                </label>
            </div>

            <button type="submit" class="complain-submit-button" id="submitBtn">
                Submit Feedback
            </button>
        </form>
    </div>

    <script>
     
            // Utility: Convert file to Base64
            function toBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                });
            }
        
            // Progress bar
            function updateProgress() {
                const form = document.getElementById('complains');
                const requiredInputs = form.querySelectorAll('input[required], textarea[required]');
                const filled = Array.from(requiredInputs).filter(input => input.value.trim() !== '');
                const progress = (filled.length / requiredInputs.length) * 100;
                document.getElementById('progressBar').style.width = progress + '%';
            }
        
            // File upload handling
            const fileUpload = document.getElementById('fileUpload');
            const fileDropBox = document.querySelector('.file-drop-box');
            const fileName = document.getElementById('fileName');
        
            fileUpload.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    fileName.textContent = e.target.files[0].name;
                    fileDropBox.style.borderColor = '#2196f3';
                    fileDropBox.style.background = 'linear-gradient(135deg, #e8f0ff, #dbeafe)';
                }
            });
        
            fileDropBox.addEventListener('dragover', e => {
                e.preventDefault();
                fileDropBox.classList.add('dragover');
            });
        
            fileDropBox.addEventListener('dragleave', e => {
                e.preventDefault();
                fileDropBox.classList.remove('dragover');
            });
        
            fileDropBox.addEventListener('drop', e => {
                e.preventDefault();
                fileDropBox.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    fileUpload.files = files;
                    fileName.textContent = files[0].name;
                    fileDropBox.style.borderColor = '#2196f3';
                    fileDropBox.style.background = 'linear-gradient(135deg, #e8f0ff, #dbeafe)';
                }
            });
        
            // Input focus effects
            document.querySelectorAll('.complain-input, .complain-textarea').forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.querySelector('.heading').style.color = '#2196f3';
                });
                input.addEventListener('blur', function() {
                    this.parentElement.querySelector('.heading').style.color = '#334155';
                });
                input.addEventListener('input', updateProgress);
            });
        
            // Form submission
            document.getElementById('complains').addEventListener('submit', async function (e) {
                e.preventDefault();
        
                const form = e.target;
                const submitBtn = document.getElementById('submitBtn');
                const fileInput = document.getElementById('fileUpload');
                const file = fileInput.files[0];
        
                submitBtn.innerHTML = '<span class="spinner"></span>Submitting...';
                submitBtn.disabled = true;
        
                // Gather form data
                const formData = new FormData();
                formData.append("name", form.name.value.trim());
                formData.append("roll", form.roll.value.trim());
                formData.append("email", form.email.value.trim());
                formData.append("mobile", form.mobile.value.trim());
                formData.append("hostel", form.hostelSelect.value);
                formData.append("room", form.room.value.trim());
                formData.append("subject", form.Subject.value.trim());
                formData.append("description", form.description.value.trim());
        
                if (file) {
                    const base64 = await toBase64(file);
                    formData.append("filedata", base64.split(',')[1]);
                    formData.append("filename", file.name);
                    formData.append("mimeType", file.type);
                } else {
                    formData.append("filedata", "");
                    formData.append("filename", "");
                    formData.append("mimeType", "");
                }
        
                // Send to Google Apps Script
                fetch("#", {
                    method: "POST",
                    body: formData
                })
                .then(res => res.text())
                .then(data => {
                    if (data.includes("Success")) {
                        submitBtn.innerHTML = "✓ Submitted Successfully!";
                        submitBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                        form.reset();
                        fileName.textContent = '';
                        fileDropBox.style.borderColor = '#cbd5e1';
                        fileDropBox.style.background = 'linear-gradient(135deg, #f8fafc, #f1f5f9)';
                        updateProgress();
                    } else {
                        alert("Submission failed. Please try again.");
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Error occurred. Please try again.");
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    setTimeout(() => {
                        submitBtn.innerHTML = 'Submit Feedback';
                        submitBtn.style.background = 'linear-gradient(135deg, #2196f3, #1976d2)';
                    }, 2000);
                });
            });
        
            // Initialize progress bar
            updateProgress();
        </script>
        
        
    
</body>
</html>
